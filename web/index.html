<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<title>Куратор курса</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #deddd6;
  --accent: #2f6f4f; --accent-ink: #ffffff; --user: #e7f0ea; --err-bg: #fbeceb; --err: #9b2c24;
  --ok: #2f6f4f; --rej: #b4532a; --warn-bg: #fff6df; --warn: #7a5a00; --code: #ecebe4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201d; --ink: #e8e7e2; --muted: #9a9a92; --line: #33342f;
    --accent: #6fbf94; --accent-ink: #10130f; --user: #23302a; --err-bg: #3a1f1c; --err: #f0a39b;
    --ok: #6fbf94; --rej: #f0a36b; --warn-bg: #3a3214; --warn: #f0d27a; --code: #2a2b27;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
#status { font-size: 12px; color: var(--muted); margin-left: auto; }
#status.stale { color: var(--warn); }
#tabs { display: flex; gap: 2px; flex-wrap: wrap; width: 100%; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-bottom: 2px solid transparent;
  border-radius: 0; cursor: pointer; font-size: 14px; }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab:disabled { opacity: .55; cursor: default; }
#body { flex: 1; display: flex; min-height: 0; }
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#log { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 820px; margin: 0 auto 12px; padding: 10px 12px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--line); overflow-wrap: anywhere; }
.msg .text { white-space: pre-wrap; }
.msg.user { background: var(--user); }
.msg.error { background: var(--err-bg); color: var(--err); border-color: transparent; }
.msg.pending .text { color: var(--muted); font-style: italic; }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.msg .badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; margin-right: 6px; }
.badge.unknown { background: var(--warn-bg); color: var(--warn); }
.badge.unverified { background: var(--err-bg); color: var(--err); }
.badge.ok { background: var(--user); color: var(--ok); }
.msg ol { margin: 8px 0 0; padding-left: 22px; font-size: 13px; }
.msg ol li { margin-bottom: 4px; }
.msg .clarify { margin-top: 6px; color: var(--warn); }
.msg details { margin-top: 2px; }
.msg summary { cursor: pointer; color: var(--muted); }
.msg blockquote { margin: 4px 0 4px 8px; padding-left: 8px; border-left: 2px solid var(--accent); color: var(--muted); font-size: 13px; }
.msg .facts { margin-top: 8px; font-size: 13px; }
.msg .facts li { list-style: none; }
.msg .problems { margin-top: 6px; font-size: 13px; color: var(--err); }
code, .chunk { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--code); padding: 0 4px; border-radius: 4px; }
#form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
#input { flex: 1; resize: vertical; min-height: 44px; max-height: 40vh; font: inherit; color: inherit; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
#approve { display: none; }
#journal { width: 380px; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#journal h2 { font-size: 13px; font-weight: 600; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted);
  display: flex; align-items: center; }
#journal h2 span { margin-left: auto; font-weight: 400; }
#calls { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 13px; }
.turn { color: var(--muted); font-size: 12px; margin: 10px 0 4px; border-top: 1px dashed var(--line); padding-top: 6px; }
.turn:first-child { border-top: 0; margin-top: 0; }
.call { padding: 6px 8px; margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--line); border-left-width: 4px; }
.call[data-status=pending] { border-left-color: var(--muted); }
.call[data-status=ok] { border-left-color: var(--ok); }
.call[data-status=rejected], .call[data-status=error] { border-left-color: var(--rej); }
.call .head { display: flex; gap: 6px; align-items: baseline; }
.call .tool { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
.call .by { color: var(--muted); font-size: 12px; }
.call .secs { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.call .args { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.call .why { margin-top: 4px; color: var(--rej); font-size: 12px; white-space: pre-wrap; }
.call .result { margin-top: 4px; color: var(--muted); font-size: 12px; }
.step { color: var(--muted); font-size: 12px; margin: 4px 0; }
.step.mech { color: var(--warn); }
.placeholder { max-width: 820px; margin: 24px auto; color: var(--muted); text-align: center; }
#jtoggle { display: none; }
@media (max-width: 860px) {
  #body { flex-direction: column; }
  #journal { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; }
  #journal.collapsed #calls { display: none; }
  #jtoggle { display: inline; margin-left: 8px; }
  #status { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>Куратор курса</h1>
  <span id="status">…</span>
  <nav id="tabs">
    <button class="tab active" data-tab="help" type="button">Помощь</button>
    <button class="tab" data-tab="review" type="button">Ревью</button>
    <button class="tab" data-tab="support" type="button">Тикеты</button>
    <button class="tab" data-tab="files" type="button">Файлы</button>
    <button class="tab" data-tab="close" type="button">Закрытие</button>
  </nav>
</header>
<div id="body">
  <div id="main">
    <main id="log"></main>
    <form id="form">
      <textarea id="input" placeholder="Вопрос о каталоге курса… (/help необязателен; Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button id="send" class="primary" type="submit">Спросить</button>
      <button id="approve" type="button">Применить</button>
    </form>
  </div>
  <aside id="journal">
    <h2>Журнал хода <button id="jtoggle" type="button">свернуть</button><span id="jsum"></span></h2>
    <div id="calls"></div>
  </aside>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const DAYS = { review: "день 32: ревью PR корня в GitHub Actions", support: "день 33: поддержка пользователей оснастки",
  files: "день 34: файловый агент на правах этапа", close: "день 35: закрытие задания" };
let busy = false;
let turnNo = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function short(s, n) {
  s = (s || "").replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n) + "…" : s;
}
function scrollDown(node) { node.scrollTop = node.scrollHeight; }

// --- вкладки ---------------------------------------------------------------
for (const b of document.querySelectorAll("#tabs .tab")) {
  b.addEventListener("click", () => {
    for (const x of document.querySelectorAll("#tabs .tab")) x.classList.toggle("active", x === b);
    const tab = b.dataset.tab;
    $("form").style.display = tab === "help" ? "" : "none";
    let ph = $("log").querySelector(".placeholder");
    if (tab === "help") { if (ph) ph.remove(); return; }
    if (!ph) { ph = el("div", "placeholder"); $("log").appendChild(ph); }
    ph.textContent = DAYS[tab] + " — появится позже";
  });
}
$("jtoggle").addEventListener("click", () => {
  const j = $("journal");
  j.classList.toggle("collapsed");
  $("jtoggle").textContent = j.classList.contains("collapsed") ? "развернуть" : "свернуть";
});

// --- шапка: состояние индекса ----------------------------------------------
async function loadState() {
  try {
    const r = await fetch("/api/state");
    const s = await r.json();
    const idx = s.index || {};
    const parts = [];
    if (idx.docs || idx.chunks) {
      parts.push(`индекс: ${idx.docs} документов, ${idx.chunks} чанков`);
      if (idx.commit) parts.push("commit " + idx.commit.slice(0, 7));
      parts.push(s.stale ? "устарел — curator index" : "актуален");
    } else {
      parts.push("индекс не собран");
    }
    if (s.branch) parts.push("ветка " + s.branch);
    if (s.model) parts.push("модель " + s.model);
    if (s.note) parts.push(s.note);
    $("status").textContent = parts.join(" · ");
    $("status").classList.toggle("stale", !!s.stale);
  } catch (e) {
    $("status").textContent = "сервер не отвечает";
  }
}

// --- лента -----------------------------------------------------------------
function userBubble(text) {
  const b = el("div", "msg user");
  b.appendChild(el("div", "text", text));
  $("log").appendChild(b);
  scrollDown($("log"));
  return b;
}
function errorBubble(text) {
  const b = el("div", "msg error");
  b.appendChild(el("div", "text", text));
  $("log").appendChild(b);
  scrollDown($("log"));
}
function pendingBubble() {
  const b = el("div", "msg assistant pending");
  b.appendChild(el("div", "text", "думаю…"));
  $("log").appendChild(b);
  scrollDown($("log"));
  return b;
}

// Ответ: текст, источники «Документ › Раздел» с раскрываемой цитатой,
// факты о состоянии с call_id, пометки «не знаю»/«не проверено», счётчики.
function answerBubble(node, v) {
  node.classList.remove("pending");
  node.replaceChildren();
  const a = v.answer || {};
  const unknown = (a.status || "").toLowerCase() === "unknown";
  const head = el("div", "head");
  if (unknown) head.appendChild(el("span", "badge unknown", "не знаю"));
  if (v.unverified) head.appendChild(el("span", "badge unverified", "не проверено"));
  if (!unknown && !v.unverified) head.appendChild(el("span", "badge ok", a.sources && a.sources.length ? "проверено: цитаты дословны" : "проверено"));
  node.appendChild(head);
  node.appendChild(el("div", "text", a.answer || "(пустой ответ)"));
  if (unknown && a.clarify) node.appendChild(el("div", "clarify", "Уточните: " + a.clarify));
  if (v.sources && v.sources.length) {
    const ol = el("ol");
    for (const s of v.sources) {
      const li = el("li");
      li.appendChild(el("code", "chunk", s.chunk_id));
      li.appendChild(document.createTextNode(" " + (s.title || s.doc_id || "") + (s.path ? " › " + s.path : "")));
      if (s.quotes && s.quotes.length) {
        const d = el("details");
        d.appendChild(el("summary", "", s.quotes.length === 1 ? "цитата" : `цитаты: ${s.quotes.length}`));
        for (const q of s.quotes) d.appendChild(el("blockquote", "", "«" + q + "»"));
        li.appendChild(d);
      }
      ol.appendChild(li);
    }
    node.appendChild(ol);
  }
  if (a.state_facts && a.state_facts.length) {
    const ul = el("ul", "facts");
    ul.appendChild(el("li", "", "Факты о состоянии (из инструментов):"));
    for (const f of a.state_facts) {
      const li = el("li");
      li.appendChild(document.createTextNode("• " + f.fact + " "));
      // Имя инструмента — из журнала по call_id: «git_branch · call_00_…».
      const c = calls.get(f.call_id);
      const tool = c && c.dataset.tool ? c.dataset.tool + " · " : "";
      li.appendChild(el("code", "", tool + f.call_id));
      ul.appendChild(li);
    }
    node.appendChild(ul);
  }
  const problems = [].concat((v.check && v.check.problems) || [], v.state_problems || []);
  if (v.unverified && problems.length) node.appendChild(el("div", "problems", "Не проверено: " + problems.join("; ")));
  const st = v.stats || {};
  const u = st.usage || {};
  const cost = st.cost && st.cost.known ? ` · $${st.cost.usd.toFixed(4)}` : "";
  node.appendChild(el("div", "meta", `${(v.seconds || 0).toFixed(1)} с · запросов ${st.steps || 0} · вызовов ${st.toolCalls || 0} · токенов ${u.total || 0}${cost}` +
    (st.rejected ? ` · отказов проверки ${st.rejected}` : "") + (v.error ? ` · ошибка: ${v.error}` : "")));
  scrollDown($("log"));
}

// --- журнал ----------------------------------------------------------------
const calls = new Map(); // callId → узел .call
let steps = 0;
function journalTurn(text) {
  turnNo++;
  calls.clear();
  steps = 0;
  const t = el("div", "turn", `ход ${turnNo}: ${short(text, 60)}`);
  $("calls").appendChild(t);
  $("jsum").textContent = "";
}
function journal(e) {
  const box = $("calls");
  switch (e.kind) {
    case "tool.call": {
      const c = el("div", "call");
      c.dataset.tool = e.tool || "";
      c.dataset.status = "pending";
      c.dataset.callId = e.callId || "";
      const head = el("div", "head");
      head.appendChild(el("span", "tool", e.tool));
      if (e.final) head.appendChild(el("span", "by", "завершение"));
      else if ((e.title || "").includes("кодом")) head.appendChild(el("span", "by", "кодом до запроса"));
      head.appendChild(el("span", "secs", ""));
      c.appendChild(head);
      c.appendChild(el("div", "args", short(e.detail, 160)));
      box.appendChild(c);
      if (e.callId) calls.set(e.callId, c);
      break;
    }
    case "tool.result": {
      const c = calls.get(e.callId);
      if (!c) break;
      c.dataset.status = "ok";
      c.querySelector(".secs").textContent = e.seconds ? e.seconds.toFixed(2) + " с" : "";
      if (!e.final) c.appendChild(el("div", "result", short(e.title, 80)));
      else c.appendChild(el("div", "result", "принят"));
      break;
    }
    case "tool.error": {
      const c = calls.get(e.callId);
      if (!c) { box.appendChild(el("div", "step", `${e.tool}: ${short(e.detail, 200)}`)); break; }
      c.dataset.status = e.rejected ? "rejected" : "error";
      c.querySelector(".secs").textContent = e.seconds ? e.seconds.toFixed(2) + " с" : "";
      c.appendChild(el("div", "why", (e.rejected ? "отказ: " : "ошибка: ") + short(e.detail, 600)));
      break;
    }
    case "llm.request":
      steps++;
      box.appendChild(el("div", "step", `запрос к модели ${steps}` + (e.tokens ? ` · ≈${e.tokens.estimated} токенов` : "")));
      break;
    case "llm.response":
      box.appendChild(el("div", "step", `← ${short(e.title, 80)}` + (e.seconds ? ` · ${e.seconds.toFixed(1)} с` : "") +
        (e.usage ? ` · ${e.usage.total} токенов` : "")));
      break;
    case "mechanism":
      box.appendChild(el("div", "step mech", short(e.title, 200)));
      break;
    case "note":
    case "source.injection":
      box.appendChild(el("div", "step", short(e.title, 200)));
      break;
    default:
      return;
  }
  $("jsum").textContent = `запросов ${steps} · вызовов ${calls.size}`;
  scrollDown(box);
}

// --- отправка: POST /api/ask, поток SSE ------------------------------------
async function ask(text) {
  busy = true;
  $("send").disabled = true;
  userBubble(text);
  journalTurn(text);
  const node = pendingBubble();
  try {
    const r = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok) {
      let msg = `ошибка ${r.status}`;
      try { const j = await r.json(); if (j.error) msg = j.error; } catch (x) {}
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", got = false;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let name = "", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event: ")) name = line.slice(7);
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        if (!name) continue;
        let v;
        try { v = JSON.parse(data); } catch (x) { continue; }
        if (name === "journal") journal(v);
        else if (name === "answer") { got = true; answerBubble(node, v); }
        else if (name === "error") throw new Error(v.error || "ход не удался");
      }
    }
    if (!got) throw new Error("ответ не пришёл");
  } catch (err) {
    node.remove();
    errorBubble(err.message || "нет связи с сервером");
  } finally {
    busy = false;
    $("send").disabled = false;
    $("input").focus();
    loadState();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  $("input").value = "";
  ask(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

loadState();
setInterval(loadState, 30000);
</script>
</body>
</html>
